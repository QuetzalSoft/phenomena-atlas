# The contract safety net.
#
# This workflow is the reason the polyrepo-with-contracts architecture holds together.
# ADR 0001 chose separate repositories because the components deploy independently; the
# price is that nothing stops an API change from breaking a client at runtime. These
# three checks are what buy that safety back. If they are ever made advisory, the
# architecture silently reverts to the option ADR 0001 rejected.

name: Contract

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"

env:
  OASDIFF_VERSION: "1.34.1"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed so the base revision of the generated document is available below.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: contracts
        run: bun install --frozen-lockfile

      - name: Compile the contract
        working-directory: contracts
        run: bun run build

      # The generated document is committed so that pull requests show the real diff of
      # the interface and so oasdiff has a baseline. This step proves it is not stale.
      - name: Generated document is up to date
        run: |
          if ! git diff --exit-code -- contracts/generated/; then
            echo "::error::contracts/generated/ is out of date. Run 'bun run build' in contracts/ and commit the result."
            exit 1
          fi

      - name: Install oasdiff
        if: github.event_name == 'pull_request'
        run: |
          curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin oasdiff
          oasdiff --version

      # --fail-on ERR is not optional. Without it oasdiff prints the breaking change and
      # still exits 0, so the check reports the problem and lets the merge through.
      # Verified against oasdiff 1.34.1 on 2026-10-22.
      - name: No breaking changes
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          if ! git cat-file -e "$BASE:contracts/generated/openapi.yaml" 2>/dev/null; then
            echo "No contract on $BASE yet; nothing to compare against."
            exit 0
          fi
          git show "$BASE:contracts/generated/openapi.yaml" > /tmp/base-openapi.yaml
          oasdiff breaking --fail-on ERR /tmp/base-openapi.yaml contracts/generated/openapi.yaml
