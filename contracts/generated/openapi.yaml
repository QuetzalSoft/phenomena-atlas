openapi: 3.1.0
info:
  title: Phenomena Atlas API
  version: 0.1.0
  summary: The API behind Phenomena Atlas, consumed by the web and mobile clients.
  description: |-
    Every Phenomena Atlas client reaches domain data through this API. No client talks
    to the database directly.

    Before 1.0.0 the contract covers accounts and roles, the municipalities and region
    partition of the metropolitan area, the definition of phenomena: their
    characteristics and their weighting function, and the incident reports filed about
    them.
tags: []
paths:
  /accounts:
    get:
      operationId: Accounts_listAccounts
      summary: List accounts.
      description: |-
        Lists accounts and their roles, oldest first. Every filter is optional, and the ones
        given combine: an account is listed only when it matches all of them.

        A cursor is only valid with the filters of the request that returned it; pass the same
        filters again with it. When both dates are given, `createdFrom` must be earlier than
        `createdBefore`, or the API answers 400 with the code `invalid_date_range`.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many accounts to return. Defaults to 50.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
          explode: false
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema:
            type: string
          explode: false
        - name: role
          in: query
          required: false
          description: Only accounts with this role.
          schema:
            $ref: '#/components/schemas/Role'
          explode: false
        - name: q
          in: query
          required: false
          description: |-
            Only accounts whose username, name or email contains this text, ignoring case.
            Every character is taken literally.
          schema:
            type: string
            minLength: 1
            maxLength: 100
          explode: false
        - name: createdFrom
          in: query
          required: false
          description: Only accounts created at or after this instant.
          schema:
            type: string
            format: date-time
          explode: false
        - name: createdBefore
          in: query
          required: false
          description: Only accounts created before this instant. Together with `createdFrom`, a half-open range.
          schema:
            type: string
            format: date-time
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-minimum-role: admin
  /accounts/me:
    get:
      operationId: Accounts_getMyAccount
      summary: The caller's account.
      description: |-
        Returns the caller's own account, creating it with the role `user` on the first call.
        Clients use it to learn which role the signed-in person holds.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-minimum-role: user
  /accounts/me/incident-reports:
    get:
      operationId: IncidentReports_listMyIncidentReports
      summary: List my incident reports.
      description: |-
        Lists the reports the caller filed, most recently filed first. A cursor is only valid
        with the filters of the request that returned it.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many reports to return. Defaults to 50.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
          explode: false
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema:
            type: string
          explode: false
        - name: phenomenonId
          in: query
          required: false
          description: Only reports about this phenomenon.
          schema:
            $ref: '#/components/schemas/PhenomenonId'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentReportPage'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-minimum-role: user
  /accounts/me/profile:
    put:
      operationId: Accounts_updateMyProfile
      summary: Edit the caller's own details.
      description: |-
        Changes the caller's own first name, last name and email. The change is written to the
        identity provider first and then to the account, so it shows at once and is still there
        after signing out and in. Nothing changes when the request fails.

        A value outside the limits of the request body answers 400 `invalid_request`, as
        everywhere else. A value inside them that the identity provider refuses answers 400
        `invalid_account_details`; an email that another account already has answers 409
        `email_already_in_use`; an identity provider that could not be reached, or that failed
        in another way, answers 503 `account_update_unavailable`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            The request conflicts with the current state of the resource: it changed since the
            version the request was based on, or the value asked for is already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |-
            The service could not complete the request right now. Nothing was changed, and the
            request can be tried again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountProfile'
      x-minimum-role: user
  /accounts/{accountId}/profile:
    put:
      operationId: Accounts_updateAccountProfile
      summary: Edit an account's details.
      description: |-
        Changes another account's first name, last name and email. Only admins may; the person's
        own details are edited with `updateMyProfile`. It writes and fails the way
        `updateMyProfile` does: 400 `invalid_account_details`, 409 `email_already_in_use` and
        503 `account_update_unavailable`, and nothing changes in any of them. The person sees the
        new details the next time they sign in.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            The request conflicts with the current state of the resource: it changed since the
            version the request was based on, or the value asked for is already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |-
            The service could not complete the request right now. Nothing was changed, and the
            request can be tried again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountProfile'
      x-minimum-role: admin
  /accounts/{accountId}/role:
    put:
      operationId: Accounts_changeAccountRole
      summary: Change an account's role.
      description: |-
        Changes an account's role. Admins cannot change their own role, which answers 403 with
        the code `own_role_change_forbidden`; this keeps the system from losing its last admin.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: '#/components/schemas/Role'
              required:
                - role
      x-minimum-role: admin
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe.
      description: |-
        Returns successfully when the service is running. Carries no domain meaning and
        is safe to call without authentication.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security:
        - {}
  /incident-reports/{incidentReportId}:
    delete:
      operationId: IncidentReports_removeIncidentReport
      summary: Remove an incident report.
      description: |-
        Removes a report, for abuse or to erase personal data. It is the only way a report stops
        counting. An unknown report answers 404 with the code `incident_report_not_found`.
      parameters:
        - name: incidentReportId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IncidentReportId'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-minimum-role: admin
  /municipalities:
    get:
      operationId: Regions_listMunicipalities
      summary: List municipalities.
      description: Returns the four municipalities of the metropolitan area with their boundaries.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MunicipalityCollection'
      security:
        - {}
  /phenomena:
    get:
      operationId: Phenomena_listPhenomena
      summary: List phenomena.
      description: |-
        Lists phenomena by name. Admins see every phenomenon and can filter by status; anyone
        else, signed in or not, sees only published ones, and asking for another status
        answers 403 with the code `forbidden`.
      parameters:
        - name: status
          in: query
          required: false
          description: Only phenomena with this status.
          schema:
            $ref: '#/components/schemas/PhenomenonStatus'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhenomenonList'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - {}
        - BearerAuth: []
    post:
      operationId: Phenomena_createPhenomenon
      summary: Create a phenomenon.
      description: |-
        Creates a phenomenon as a draft, at revision 1. A new phenomenon usually starts with
        no characteristics and a `blank` weighting function. It starts with a refresh interval
        of 60 minutes, changed by updating the phenomenon.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phenomenon'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhenomenonDefinition'
      x-minimum-role: admin
  /phenomena/{phenomenonId}:
    get:
      operationId: Phenomena_getPhenomenon
      summary: A phenomenon.
      description: |-
        Returns one phenomenon. Drafts and archived phenomena are visible to admins only;
        for anyone else the API answers 404 with the code `phenomenon_not_found`, as it does
        when there is no such phenomenon.
      parameters:
        - name: phenomenonId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PhenomenonId'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phenomenon'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - {}
        - BearerAuth: []
    put:
      operationId: Phenomena_updatePhenomenon
      summary: Change a phenomenon.
      description: |-
        Replaces a phenomenon's definition. Characteristics and options already saved must
        all be sent again, with the same key and type: they are retired, never removed.
        Answers 409 with the code `phenomenon_revision_conflict` when `baseRevision` is no
        longer the latest revision.
      parameters:
        - name: phenomenonId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PhenomenonId'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phenomenon'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            The request conflicts with the current state of the resource: it changed since the
            version the request was based on, or the value asked for is already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhenomenonChange'
      x-minimum-role: admin
    delete:
      operationId: Phenomena_deletePhenomenon
      summary: Delete a draft phenomenon.
      description: |-
        Deletes a draft. A phenomenon that was ever published may have reports, so it can only
        be archived: deleting one answers 409 with the code `phenomenon_not_draft`.
      parameters:
        - name: phenomenonId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PhenomenonId'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            The request conflicts with the current state of the resource: it changed since the
            version the request was based on, or the value asked for is already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-minimum-role: admin
  /phenomena/{phenomenonId}/incident-reports:
    post:
      operationId: IncidentReports_fileIncidentReport
      summary: File an incident report.
      description: |-
        Files an incident report about a phenomenon. Only a published phenomenon accepts them:
        for a phenomenon the caller cannot see the API answers 404 with the code
        `phenomenon_not_found`, and for a draft or an archived one an admin can see it answers
        409 with the code `phenomenon_not_accepting_reports`.
      parameters:
        - name: phenomenonId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PhenomenonId'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentReport'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            The request conflicts with the current state of the resource: it changed since the
            version the request was based on, or the value asked for is already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentReportDraft'
      x-minimum-role: user
    get:
      operationId: IncidentReports_listPhenomenonIncidentReports
      summary: List the incident reports of a phenomenon.
      description: |-
        Lists the reports of a phenomenon, most recently filed first, without their authors.
        Every filter is optional, and the ones given combine. A cursor is only valid with the
        filters of the request that returned it.

        When both dates are given, `occurredFrom` must be earlier than `occurredBefore`, or the
        API answers 400 with the code `invalid_date_range`. An unknown phenomenon answers 404
        with the code `phenomenon_not_found`.
      parameters:
        - name: phenomenonId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PhenomenonId'
        - name: limit
          in: query
          required: false
          description: How many reports to return. Defaults to 50.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
          explode: false
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema:
            type: string
          explode: false
        - name: regionId
          in: query
          required: false
          description: Only reports filed in this region.
          schema:
            $ref: '#/components/schemas/RegionId'
          explode: false
        - name: occurredFrom
          in: query
          required: false
          description: Only incidents that took place on or after this day.
          schema:
            type: string
            format: date
          explode: false
        - name: occurredBefore
          in: query
          required: false
          description: Only incidents that took place before this day. Together with `occurredFrom`, a half-open range.
          schema:
            type: string
            format: date
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentReportPage'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-minimum-role: analyst
  /phenomena/{phenomenonId}/status:
    put:
      operationId: Phenomena_changePhenomenonStatus
      summary: Change a phenomenon's status.
      description: |-
        Publishes, archives or republishes a phenomenon. A draft can be published, a
        published phenomenon archived, and an archived one published again; nothing goes
        back to draft. Errors:

        - 400 `incomplete_weighting_function`: publishing a function with a blank.
        - 409 `invalid_status_transition`: any other change of status.
        - 409 `phenomenon_revision_conflict`: `baseRevision` is no longer the latest revision.
      parameters:
        - name: phenomenonId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PhenomenonId'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phenomenon'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            The request conflicts with the current state of the resource: it changed since the
