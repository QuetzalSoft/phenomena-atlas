openapi: 3.1.0
info:
  title: Phenomena Atlas API
  version: 0.1.0
  summary: The API behind Phenomena Atlas, consumed by the web and mobile clients.
  description: |-
    Every Phenomena Atlas client reaches domain data through this API. No client talks
    to the database directly.

    Before 1.0.0 the contract covers accounts and roles, and the municipalities and region
    partition of the metropolitan area. The phenomenon operations depend on the glossary in
    ../docs/domain.md defining what a phenomenon is.
tags: []
paths:
  /accounts:
    get:
      operationId: Accounts_listAccounts
      summary: List accounts.
      description: |-
        Lists accounts and their roles, oldest first. Every filter is optional, and the ones
        given combine: an account is listed only when it matches all of them.

        A cursor is only valid with the filters of the request that returned it; pass the same
        filters again with it. When both dates are given, `createdFrom` must be earlier than
        `createdBefore`, or the API answers 400 with the code `invalid_date_range`.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many accounts to return. Defaults to 50.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
          explode: false
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema:
            type: string
          explode: false
        - name: role
          in: query
          required: false
          description: Only accounts with this role.
          schema:
            $ref: '#/components/schemas/Role'
          explode: false
        - name: q
          in: query
          required: false
          description: |-
            Only accounts whose username, name or email contains this text, ignoring case.
            Every character is taken literally.
          schema:
            type: string
            minLength: 1
            maxLength: 100
          explode: false
        - name: createdFrom
          in: query
          required: false
          description: Only accounts created at or after this instant.
          schema:
            type: string
            format: date-time
          explode: false
        - name: createdBefore
          in: query
          required: false
          description: Only accounts created before this instant. Together with `createdFrom`, a half-open range.
          schema:
            type: string
            format: date-time
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-minimum-role: admin
  /accounts/me:
    get:
      operationId: Accounts_getMyAccount
      summary: The caller's account.
      description: |-
        Returns the caller's own account, creating it with the role `user` on the first call.
        Clients use it to learn which role the signed-in person holds.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-minimum-role: user
  /accounts/{accountId}/role:
    put:
      operationId: Accounts_changeAccountRole
      summary: Change an account's role.
      description: |-
        Changes an account's role. Admins cannot change their own role, which answers 403 with
        the code `own_role_change_forbidden`; this keeps the system from losing its last admin.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: '#/components/schemas/Role'
              required:
                - role
      x-minimum-role: admin
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe.
      description: |-
        Returns successfully when the service is running. Carries no domain meaning and
        is safe to call without authentication.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security:
        - {}
  /municipalities:
    get:
      operationId: Regions_listMunicipalities
      summary: List municipalities.
      description: Returns the four municipalities of the metropolitan area with their boundaries.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MunicipalityCollection'
      security:
        - {}
  /region-partition:
    get:
      operationId: Regions_getRegionPartition
      summary: The current region partition.
      description: |-
        Returns every region of the latest partition version. Answers 404 with the code
        `partition_not_loaded` before the initial partition is loaded.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionPartition'
        '404':
          description: The resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - {}
  /region-partition/versions:
    get:
      operationId: Regions_listPartitionVersions
      summary: List partition versions.
      description: Lists the saved partition versions and what each one changed, newest first.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many versions to return. Defaults to 50.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
          explode: false
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartitionVersionPage'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-minimum-role: admin
    post:
      operationId: Regions_savePartitionVersion
      summary: Save a partition version.
      description: |-
        Saves a change to the region partition as the next version. The change is applied
        atomically and then validated; if any rule fails, nothing is saved.

        Errors, each with its own `code`. In `details`, `regionIds` lists the existing regions
        involved, `draftIndexes` the positions in `regions` of new ones, and `geometry` the
        offending area when there is one:

        - 400 `empty_change`: no region to create, change or retire.
        - 400 `duplicate_region_in_change`: a region appears more than once.
        - 400 `region_not_found`: an id that does not exist or was already retired.
        - 400 `invalid_geometry`: a geometry that is empty or not valid.
        - 400 `region_crosses_municipality`: a region reaches into another municipality, or
          a changed region moves to another municipality.
        - 400 `region_out_of_area`: a region reaches outside the metropolitan area.
        - 400 `region_overlap`: two regions overlap.
        - 400 `partition_gap`: part of a municipality is left without a region.
        - 409 `partition_version_conflict`: `baseVersion` is no longer the latest version.

        Overlaps and gaps under one square metre are tolerated. Coordinates are returned
        exactly as stored, so geometries built from them match their neighbours' borders.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartitionVersion'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The resource changed since the version the request was based on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartitionChange'
      x-minimum-role: admin
  /region-partition/versions/{number}:
    get:
      operationId: Regions_getPartitionVersion
      summary: A past region partition.
      description: |-
        Returns every region as it was in one partition version. Answers 404 with the code
        `partition_version_not_found` when there is no such version.
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionPartition'
        '400':
          description: The request does not match the contract. `details` lists what was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The access token is missing, invalid or expired.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                  - Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller's role does not allow this operation, or the operation's own rules forbid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-minimum-role: admin
security:
  - BearerAuth: []
components:
  schemas:
    Account:
      type: object
      required:
        - id
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: The API's own identifier for the account.
        username:
          type: string
          description: The login name the identity provider reports. Absent until the person first signs in.
        name:
          type: string
          description: The person's display name, when the identity provider has one.
        email:
          type: string
          description: The person's email address, when the identity provider has one.
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
          description: When the account was created.
      description: |-
        A person known to the API, created the first time they call it with a valid token.
        The profile fields are copied from that token and refreshed when they change.
    AccountPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        nextCursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent on the last page.
      description: One page of accounts, oldest first.
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable identifier. Clients branch on this, never on message.
          examples:
            - phenomenon_not_found
        message:
          type: string
          description: Human-readable explanation. Not stable, not for client logic.
        details:
          type: object
          additionalProperties: {}
          description: Optional structured context. Its shape depends on code.
      description: The error shape returned by every failing request.
    GeoJson.Geometry:
      anyOf:
        - $ref: '#/components/schemas/GeoJson.Point'
        - $ref: '#/components/schemas/GeoJson.LineString'
        - $ref: '#/components/schemas/GeoJson.Polygon'
        - $ref: '#/components/schemas/GeoJson.MultiPoint'
        - $ref: '#/components/schemas/GeoJson.MultiPolygon'
      description: Any GeoJSON geometry.
    GeoJson.LineString:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - LineString
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
          minItems: 2
      description: A connected sequence of positions.
    GeoJson.MultiPoint:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - MultiPoint
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
      description: Several separate locations treated as one geometry.
    GeoJson.MultiPolygon:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - MultiPolygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: number
                  format: double
      description: Several separate areas treated as one geometry.
    GeoJson.Point:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Point
        coordinates:
          type: array
          items:
            type: number
            format: double
          minItems: 2
          maxItems: 3
      description: A single location.
    GeoJson.Polygon:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
                format: double
          minItems: 1
      description: An area. The first ring is the outer boundary; any further rings are holes.
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Municipality:
      type: object
      required:
        - type
        - geometry
        - properties
        - id
      properties:
        type:
          type: string
          enum:
            - Feature
        geometry:
          $ref: '#/components/schemas/GeoJson.MultiPolygon'
        properties:
          $ref: '#/components/schemas/MunicipalityProperties'
        bbox:
          type: array
          items:
            type: number
            format: double
          minItems: 4
          maxItems: 4
          description: Extent of the geometry. Optional, and only an optimisation for clients.
        id:
          $ref: '#/components/schemas/MunicipalityCode'
      description: One municipality of the metropolitan area, with its INEGI boundary.
    MunicipalityCode:
      type: string
      pattern: ^[0-9]{5}$
      description: "A municipality's five-digit INEGI key: state then municipality, e.g. `14039`."
      examples:
        - '14039'
    MunicipalityCollection:
      type: object
      required:
        - type
        - features
      properties:
        type:
          type: string
          enum:
            - FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/Municipality'
        bbox:
          type: array
          items:
            type: number
            format: double
          minItems: 4
          maxItems: 4
          description: Extent of all the features. Optional, and only an optimisation for clients.
      description: The four municipalities of the metropolitan area.
    MunicipalityProperties:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The municipality's name as INEGI writes it.
    PartitionChange:
      type: object
      required:
        - baseVersion
        - regions
        - retiredRegionIds
      properties:
        baseVersion:
          type: integer
          format: int32
          minimum: 1
          description: The version the change was made against. It must still be the latest.
        regions:
          type: array
          items:
            $ref: '#/components/schemas/RegionDraft'
          description: Regions to create or change. Each region appears at most once.
        retiredRegionIds:
          type: array
          items:
            $ref: '#/components/schemas/RegionId'
          description: Regions to retire. Their area must be covered by the regions above.
      description: A change to the region partition, applied as a whole or not at all.
    PartitionVersion:
      type: object
      required:
        - number
        - createdAt
        - added
        - changed
        - retired
      properties:
        number:
          type: integer
          format: int32
          minimum: 1
        createdAt:
          type: string
          format: date-time
        author:
          $ref: '#/components/schemas/PartitionVersionAuthor'
          description: The admin who saved it. Absent for version 1, the initial load.
        added:
          type: array
          items:
            $ref: '#/components/schemas/RegionId'
          description: Regions this version created.
        changed:
          type: array
          items:
            $ref: '#/components/schemas/RegionId'
          description: Regions this version renamed, reshaped or gave a new population.
        retired:
          type: array
          items:
            $ref: '#/components/schemas/RegionId'
          description: Regions this version retired.
      description: One saved state of the region partition, and what it changed.
    PartitionVersionAuthor:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
      description: Who saved a partition version.
    PartitionVersionPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartitionVersion'
        nextCursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent on the last page.
      description: One page of partition versions, newest first.
    Region:
      type: object
      required:
        - type
        - geometry
        - properties
        - id
      properties:
        type:
          type: string
          enum:
            - Feature
        geometry:
          $ref: '#/components/schemas/GeoJson.MultiPolygon'
        properties:
          $ref: '#/components/schemas/RegionProperties'
        bbox:
          type: array
          items:
            type: number
            format: double
          minItems: 4
          maxItems: 4
          description: Extent of the geometry. Optional, and only an optimisation for clients.
        id:
          $ref: '#/components/schemas/RegionId'
      description: An area of the metropolitan area that the maps paint in its own colour.
    RegionDraft:
      type: object
      required:
        - name
        - population
        - municipalityCode
        - geometry
      properties:
        id:
          $ref: '#/components/schemas/RegionId'
          description: The id of the region to change. Omit it to create a region.
        name:
          type: string
          minLength: 1
          maxLength: 200
        population:
          type: integer
          format: int32
          minimum: 0
          description: How many people live in the region.
        municipalityCode:
          $ref: '#/components/schemas/MunicipalityCode'
          description: The municipality the region lies entirely inside.
        geometry:
          $ref: '#/components/schemas/GeoJson.MultiPolygon'
      description: 'A region as a change sends it: new when it has no id, an existing region otherwise.'
    RegionId:
      type: integer
      format: int32
      minimum: 1
      description: A region's id. Assigned by the API, never changed and never reused.
    RegionPartition:
      type: object
      required:
        - type
        - features
        - version
        - createdAt
      properties:
        type:
          type: string
          enum:
            - FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/Region'
        bbox:
          type: array
          items:
            type: number
            format: double
          minItems: 4
          maxItems: 4
          description: Extent of all the features. Optional, and only an optimisation for clients.
        version:
          type: integer
          format: int32
          minimum: 1
          description: The partition version these regions belong to.
        createdAt:
          type: string
          format: date-time
          description: When that version was saved.
      description: |-
        The regions of one partition version. Together they cover the metropolitan area
        exactly, with no overlap.
    RegionProperties:
      type: object
      required:
        - name
        - population
        - municipalityCode
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        population:
          type: integer
          format: int32
          minimum: 0
          description: How many people live in the region.
        municipalityCode:
          $ref: '#/components/schemas/MunicipalityCode'
          description: The municipality the region lies entirely inside.
    Role:
      type: string
      enum:
        - user
        - analyst
        - admin
      description: |-
        What an account may do. Each role includes everything the role before it can do:
        user, then analyst, then admin.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: http://localhost:8000
    description: Local development
    variables: {}
