components:
  schemas:
    Account:
      type: object
      required:
        - id
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: The API's own identifier for the account.
        username:
          type: string
          description: The login name the identity provider reports. Absent until the person first signs in.
        name:
          type: string
          description: The person's display name, when the identity provider has one.
        firstName:
          type: string
          description: The person's first name, when the identity provider has one.
        lastName:
          type: string
          description: The person's last name, when the identity provider has one.
        email:
          type: string
          description: The person's email address, when the identity provider has one.
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
          description: When the account was created.
      description: |-
        A person known to the API, created the first time they call it with a valid token.
        The profile fields are copied from that token and refreshed when they change. The first
        name, last name and email can also be edited, with `updateMyProfile` and
        `updateAccountProfile`.
    AccountPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        nextCursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent on the last page.
      description: One page of accounts, oldest first.
    AccountProfile:
      type: object
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          description: The person's first name, as the identity provider keeps it.
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          description: The person's last name, as the identity provider keeps it.
        email:
          type: string
          maxLength: 254
          format: email
          description: The person's email address.
      description: |-
        The details of an account that its owner, or an admin, can edit. The display name is
        not one of them: it is the first and last name together. The username is not one
        either: it comes from the identity provider and does not change.
    AggregateFunction:
      type: string
      enum:
        - count
        - sum
        - mean
        - min
        - max
      description: |-
        How an aggregate combines the reports of a region:

        - `count`: how many reports there are. Takes no characteristic.
        - `sum`, `mean`, `min`, `max`: of the values of one characteristic. Reports without a
          value for it are left out.
    BooleanCharacteristic:
      type: object
      required:
        - type
        - key
        - label
        - required
        - retired
      properties:
        type:
          type: string
          enum:
            - boolean
        key:
          $ref: '#/components/schemas/CharacteristicKey'
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: What a person filing a report sees.
        description:
          type: string
          maxLength: 500
          description: Help shown next to the field when filing a report.
        required:
          type: boolean
          description: Whether a new report must carry a value for it.
        retired:
          type: boolean
          description: |-
            A retired characteristic is kept on the reports that already carry it, but new
            reports do not carry it and the weighting function cannot use it.
      description: Yes or no. In the weighting function, yes counts as 1 and no as 0.
    CategoryCharacteristic:
      type: object
      required:
        - type
        - key
        - label
        - required
        - retired
        - options
      properties:
        type:
          type: string
          enum:
            - category
        key:
          $ref: '#/components/schemas/CharacteristicKey'
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: What a person filing a report sees.
        description:
          type: string
          maxLength: 500
          description: Help shown next to the field when filing a report.
        required:
          type: boolean
          description: Whether a new report must carry a value for it.
        retired:
          type: boolean
          description: |-
            A retired characteristic is kept on the reports that already carry it, but new
            reports do not carry it and the weighting function cannot use it.
        options:
          type: array
          items:
            $ref: '#/components/schemas/CategoryOption'
          minItems: 1
          description: The options, in the order they are offered. At least one must not be retired.
      description: One of a closed list of options. In the weighting function it counts as the chosen option's weight.
    CategoryOption:
      type: object
      required:
        - key
        - label
        - weight
        - retired
      properties:
        key:
          $ref: '#/components/schemas/CharacteristicKey'
        label:
          type: string
          minLength: 1
          maxLength: 100
        weight:
          type: number
          format: double
          description: What the option counts as in the weighting function.
        retired:
          type: boolean
          description: A retired option is kept on existing reports but not offered for new ones.
      description: One option of a category characteristic.
    Characteristic:
      type: object
      oneOf:
        - $ref: '#/components/schemas/NumberCharacteristic'
        - $ref: '#/components/schemas/BooleanCharacteristic'
        - $ref: '#/components/schemas/CategoryCharacteristic'
        - $ref: '#/components/schemas/TextCharacteristic'
        - $ref: '#/components/schemas/DateCharacteristic'
      discriminator:
        propertyName: type
        mapping:
          number: '#/components/schemas/NumberCharacteristic'
          boolean: '#/components/schemas/BooleanCharacteristic'
          category: '#/components/schemas/CategoryCharacteristic'
          text: '#/components/schemas/TextCharacteristic'
          date: '#/components/schemas/DateCharacteristic'
      description: |-
        One field that every incident report of a phenomenon carries. Its key and its type
        never change once saved.
    CharacteristicFields:
      type: object
      required:
        - key
        - label
        - required
        - retired
      properties:
        key:
          $ref: '#/components/schemas/CharacteristicKey'
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: What a person filing a report sees.
        description:
          type: string
          maxLength: 500
          description: Help shown next to the field when filing a report.
        required:
          type: boolean
          description: Whether a new report must carry a value for it.
        retired:
          type: boolean
          description: |-
            A retired characteristic is kept on the reports that already carry it, but new
            reports do not carry it and the weighting function cannot use it.
      description: What every characteristic has, whatever its type.
    CharacteristicKey:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,39}$
      description: |-
        How a characteristic or a category option is referred to by reports and by the
        weighting function. Lowercase letters, digits and underscores, starting with a letter.
        It never changes once saved.
      examples:
        - victims
    CharacteristicValue:
      anyOf:
        - type: number
          format: double
        - type: boolean
        - type: string
      description: |-
        The value a report gives one characteristic, by the characteristic's type: a number for
        `number`, `true` or `false` for `boolean`, the key of an active option for `category`,
        the text itself for `text`, and a `YYYY-MM-DD` date for `date`.
    DateCharacteristic:
      type: object
      required:
        - type
        - key
        - label
        - required
        - retired
      properties:
        type:
          type: string
          enum:
            - date
        key:
          $ref: '#/components/schemas/CharacteristicKey'
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: What a person filing a report sees.
        description:
          type: string
          maxLength: 500
          description: Help shown next to the field when filing a report.
        required:
          type: boolean
          description: Whether a new report must carry a value for it.
        retired:
          type: boolean
          description: |-
            A retired characteristic is kept on the reports that already carry it, but new
            reports do not carry it and the weighting function cannot use it.
      description: A calendar date. Recorded with the report, but not usable in the weighting function.
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable identifier. Clients branch on this, never on message.
          examples:
            - phenomenon_not_found
        message:
          type: string
          description: Human-readable explanation. Not stable, not for client logic.
        details:
          type: object
          additionalProperties: {}
          description: Optional structured context. Its shape depends on code.
      description: The error shape returned by every failing request.
    GeoJson.Geometry:
      anyOf:
        - $ref: '#/components/schemas/GeoJson.Point'
        - $ref: '#/components/schemas/GeoJson.LineString'
        - $ref: '#/components/schemas/GeoJson.Polygon'
        - $ref: '#/components/schemas/GeoJson.MultiPoint'
        - $ref: '#/components/schemas/GeoJson.MultiPolygon'
      description: Any GeoJSON geometry.
    GeoJson.LineString:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - LineString
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
          minItems: 2
      description: A connected sequence of positions.
    GeoJson.MultiPoint:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - MultiPoint
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
      description: Several separate locations treated as one geometry.
    GeoJson.MultiPolygon:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - MultiPolygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: number
                  format: double
      description: Several separate areas treated as one geometry.
    GeoJson.Point:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Point
        coordinates:
          type: array
          items:
            type: number
            format: double
          minItems: 2
          maxItems: 3
      description: A single location.
    GeoJson.Polygon:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
                format: double
          minItems: 1
      description: An area. The first ring is the outer boundary; any further rings are holes.
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    IncidentReport:
      type: object
      required:
        - id
        - phenomenonId
        - phenomenonName
        - regionId
        - occurredOn
        - values
        - regionName
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/IncidentReportId'
        phenomenonId:
          $ref: '#/components/schemas/PhenomenonId'
        phenomenonName:
          type: string
          description: The phenomenon's name, so that a report can be shown without reading its phenomenon.
        regionId:
          $ref: '#/components/schemas/RegionId'
          description: The region of the current partition where the incident took place.
        occurredOn:
          type: string
          format: date
          description: The day the incident took place, in the metropolitan area. Not later than today.
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: |-
            What happened, in the reporter's words. Optional: free text is where a reporter is most
            likely to identify someone, so it is never asked for (ADR 0013). Left out when empty.
        values:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CharacteristicValue'
          description: |-
            One value per characteristic, keyed by the characteristic's key. Every required active
            characteristic needs one; an optional one is left out when it has no value.
        regionName:
          type: string
          description: The region's name in its latest state, which may belong to an earlier partition version.
        createdAt:
          type: string
          format: date-time
          description: When the report was filed.
      description: An incident report as filed. It never carries its author.
    IncidentReportDraft:
      type: object
      required:
        - regionId
        - occurredOn
        - values
      properties:
        regionId:
          $ref: '#/components/schemas/RegionId'
          description: The region of the current partition where the incident took place.
        occurredOn:
          type: string
          format: date
          description: The day the incident took place, in the metropolitan area. Not later than today.
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: |-
            What happened, in the reporter's words. Optional: free text is where a reporter is most
            likely to identify someone, so it is never asked for (ADR 0013). Left out when empty.
        values:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CharacteristicValue'
          description: |-
            One value per characteristic, keyed by the characteristic's key. Every required active
            characteristic needs one; an optional one is left out when it has no value.
      description: What a person states when filing an incident report.
    IncidentReportId:
      type: integer
      format: int32
      minimum: 1
      description: An incident report's identifier, assigned by the API. Never changes and is never reused.
    IncidentReportPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IncidentReport'
        nextCursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent on the last page.
      description: One page of incident reports, most recently filed first.
    Municipality:
      type: object
      required:
        - type
        - geometry
        - properties
        - id
      properties:
        type:
          type: string
          enum:
            - Feature
        geometry:
          $ref: '#/components/schemas/GeoJson.MultiPolygon'
        properties:
          $ref: '#/components/schemas/MunicipalityProperties'
        bbox:
          type: array
          items:
            type: number
            format: double
          minItems: 4
          maxItems: 4
          description: Extent of the geometry. Optional, and only an optimisation for clients.
        id:
          $ref: '#/components/schemas/MunicipalityCode'
      description: One municipality of the metropolitan area, with its INEGI boundary.
    MunicipalityCode:
      type: string
      pattern: ^[0-9]{5}$
      description: "A municipality's five-digit INEGI key: state then municipality, e.g. `14039`."
      examples:
        - '14039'
    MunicipalityCollection:
      type: object
      required:
        - type
        - features
      properties:
        type:
          type: string
          enum:
            - FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/Municipality'
        bbox:
          type: array
          items:
            type: number
            format: double
          minItems: 4
          maxItems: 4
          description: Extent of all the features. Optional, and only an optimisation for clients.
      description: The four municipalities of the metropolitan area.
    MunicipalityProperties:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The municipality's name as INEGI writes it.
    NumberCharacteristic:
      type: object
      required:
        - type
        - key
        - label
        - required
        - retired
        - integer
      properties:
        type:
          type: string
          enum:
            - number
        key:
          $ref: '#/components/schemas/CharacteristicKey'
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: What a person filing a report sees.
        description:
          type: string
          maxLength: 500
          description: Help shown next to the field when filing a report.
        required:
          type: boolean
          description: Whether a new report must carry a value for it.
        retired:
          type: boolean
          description: |-
            A retired characteristic is kept on the reports that already carry it, but new
            reports do not carry it and the weighting function cannot use it.
        integer:
          type: boolean
          description: Whether only whole numbers are accepted.
        minimum:
          type: number
          format: double
          description: The smallest value accepted, when there is one.
        maximum:
          type: number
          format: double
          description: The largest value accepted, when there is one. Not less than `minimum`.
        unit:
          type: string
          maxLength: 20
          description: The unit the value is expressed in, shown next to it.
      description: A number. In the weighting function it counts as its value.
    PartitionChange:
      type: object
      required:
        - baseVersion
        - regions
        - retiredRegionIds
      properties:
        baseVersion:
          type: integer
          format: int32
          minimum: 1
          description: The version the change was made against. It must still be the latest.
        regions:
          type: array
          items:
            $ref: '#/components/schemas/RegionDraft'
          description: Regions to create or change. Each region appears at most once.
        retiredRegionIds:
          type: array
          items:
            $ref: '#/components/schemas/RegionId'
          description: Regions to retire. Their area must be covered by the regions above.
      description: A change to the region partition, applied as a whole or not at all.
    PartitionVersion:
      type: object
      required:
        - number
        - createdAt
        - added
        - changed
        - retired
      properties:
        number:
          type: integer
          format: int32
          minimum: 1
        createdAt:
          type: string
          format: date-time
        author:
          $ref: '#/components/schemas/PartitionVersionAuthor'
          description: The admin who saved it. Absent for version 1, the initial load.
        added:
          type: array
          items:
            $ref: '#/components/schemas/RegionId'
          description: Regions this version created.
        changed:
          type: array
          items:
            $ref: '#/components/schemas/RegionId'
          description: Regions this version renamed, reshaped or gave a new population.
        retired:
          type: array
          items:
            $ref: '#/components/schemas/RegionId'
          description: Regions this version retired.
      description: One saved state of the region partition, and what it changed.
    PartitionVersionAuthor:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
      description: Who saved a partition version.
    PartitionVersionPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartitionVersion'
        nextCursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent on the last page.
      description: One page of partition versions, newest first.
    Phenomenon:
      type: object
      required:
        - id
        - name
        - description
        - characteristics
        - weightingFunction
        - refreshIntervalMinutes
        - status
        - revision
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/PhenomenonId'
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          description: What the phenomenon is and what its map shows.
        characteristics:
          type: array
          items:
            $ref: '#/components/schemas/Characteristic'
          maxItems: 50
          description: The fields every incident report carries, in the order they are shown. Keys are unique.
        weightingFunction:
          $ref: '#/components/schemas/WeightingExpression'
        refreshIntervalMinutes:
          $ref: '#/components/schemas/RefreshIntervalMinutes'
          description: A new phenomenon starts with 60.
        status:
          $ref: '#/components/schemas/PhenomenonStatus'
        revision:
          type: integer
          format: int32
          minimum: 1
          description: Grows by one on every change. Send it back as `baseRevision` to change the phenomenon.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: Something the atlas maps, with the fields its reports carry and how its index is computed.
    PhenomenonChange:
      type: object
      required:
        - baseRevision
        - name
        - description
        - characteristics
        - weightingFunction
      properties:
        baseRevision:
          type: integer
          format: int32
          minimum: 1
          description: The revision the change was made against. It must still be the latest.
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          description: What the phenomenon is and what its map shows.
        characteristics:
          type: array
          items:
            $ref: '#/components/schemas/Characteristic'
          maxItems: 50
          description: The fields every incident report carries, in the order they are shown. Keys are unique.
        weightingFunction:
          $ref: '#/components/schemas/WeightingExpression'
        refreshIntervalMinutes:
          $ref: '#/components/schemas/RefreshIntervalMinutes'
          description: 'Omitted: the current interval is kept, so a client that does not know this field cannot reset it.'
      description: |-
        A new definition for an existing phenomenon. It replaces the previous one as a whole,
        except that an omitted refreshIntervalMinutes keeps its current value.
    PhenomenonDefinition:
      type: object
      required:
        - name
        - description
        - characteristics
        - weightingFunction
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          description: What the phenomenon is and what its map shows.
        characteristics:
          type: array
          items:
            $ref: '#/components/schemas/Characteristic'
          maxItems: 50
          description: The fields every incident report carries, in the order they are shown. Keys are unique.
        weightingFunction:
          $ref: '#/components/schemas/WeightingExpression'
      description: What an admin defines about a phenomenon.
    PhenomenonId:
      type: integer
      format: int32
      minimum: 1
      description: A phenomenon's id. Assigned by the API, never changed and never reused.
    PhenomenonList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Phenomenon'
      description: The phenomena the caller can see, by name.
    PhenomenonStatus:
      type: string
      enum:
        - draft
        - published
        - archived
      description: |-
        Where a phenomenon is in its life:

        - `draft`: being defined. Only admins see it, and it accepts no reports.
        - `published`: public, and accepts reports.
        - `archived`: hidden from everyone but admins. Its reports are kept; it accepts no new ones.
    PhenomenonStatusChange:
      type: object
      required:
        - baseRevision
        - status
      properties:
        baseRevision:
          type: integer
          format: int32
          minimum: 1
          description: The revision the change was made against. It must still be the latest.
        status:
          $ref: '#/components/schemas/PhenomenonStatus'
      description: A change of a phenomenon's status.
    RefreshIntervalMinutes:
      type: integer
      format: int32
      minimum: 5
      maximum: 43200
      description: |-
        How often, in minutes, the index of a phenomenon is recomputed for every region of the
        current partition. The index is recomputed at least once per interval; between runs, the
        map shows the last computed index. A change takes effect from the next run and does not
        change past values. Public, like the rest of a published definition. From 5 minutes to
        30 days.
    Region:
      type: object
      required:
        - type
        - geometry
        - properties
        - id
      properties:
        type:
          type: string
          enum:
            - Feature
        geometry:
          $ref: '#/components/schemas/GeoJson.MultiPolygon'
        properties:
          $ref: '#/components/schemas/RegionProperties'
        bbox:
          type: array
          items:
            type: number
            format: double
          minItems: 4
          maxItems: 4
          description: Extent of the geometry. Optional, and only an optimisation for clients.
        id:
          $ref: '#/components/schemas/RegionId'
      description: An area of the metropolitan area that the maps paint in its own colour.
    RegionDraft:
      type: object
      required:
        - name
        - population
        - municipalityCode
        - geometry
      properties:
        id:
          $ref: '#/components/schemas/RegionId'
          description: The id of the region to change. Omit it to create a region.
        name:
          type: string
          minLength: 1
          maxLength: 200
        population:
          type: integer
          format: int32
          minimum: 0
          description: How many people live in the region.
        municipalityCode:
          $ref: '#/components/schemas/MunicipalityCode'
          description: The municipality the region lies entirely inside.
        geometry:
          $ref: '#/components/schemas/GeoJson.MultiPolygon'
      description: 'A region as a change sends it: new when it has no id, an existing region otherwise.'
    RegionId:
      type: integer
      format: int32
      minimum: 1
      description: A region's id. Assigned by the API, never changed and never reused.
    RegionPartition:
      type: object
      required:
        - type
        - features
        - version
        - createdAt
      properties:
        type:
          type: string
          enum:
            - FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/Region'
        bbox:
          type: array
          items:
            type: number
            format: double
          minItems: 4
          maxItems: 4
          description: Extent of all the features. Optional, and only an optimisation for clients.
        version:
          type: integer
          format: int32
          minimum: 1
          description: The partition version these regions belong to.
        createdAt:
          type: string
          format: date-time
          description: When that version was saved.
      description: |-
        The regions of one partition version. Together they cover the metropolitan area
        exactly, with no overlap.
    RegionProperties:
      type: object
      required:
        - name
        - population
        - municipalityCode
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        population:
          type: integer
          format: int32
          minimum: 0
          description: How many people live in the region.
        municipalityCode:
          $ref: '#/components/schemas/MunicipalityCode'
          description: The municipality the region lies entirely inside.
    Role:
      type: string
      enum:
        - user
        - analyst
        - admin
      description: |-
        What an account may do. Each role includes everything the role before it can do:
        user, then analyst, then admin.
    TextCharacteristic:
      type: object
      required:
        - type
        - key
        - label
        - required
        - retired
        - maxLength
      properties:
        type:
          type: string
          enum:
            - text
        key:
          $ref: '#/components/schemas/CharacteristicKey'
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: What a person filing a report sees.
        description:
          type: string
          maxLength: 500
          description: Help shown next to the field when filing a report.
        required:
          type: boolean
          description: Whether a new report must carry a value for it.
        retired:
          type: boolean
          description: |-
            A retired characteristic is kept on the reports that already carry it, but new
            reports do not carry it and the weighting function cannot use it.
        maxLength:
          type: integer
          format: int32
          minimum: 1
          maximum: 5000
          description: The longest text accepted, in characters.
      description: Free text. Recorded with the report, but not usable in the weighting function.
    WeightingAggregate:
      type: object
      required:
        - kind
        - function
      properties:
        kind:
          type: string
          enum:
            - aggregate
        function:
          $ref: '#/components/schemas/AggregateFunction'
        characteristicKey:
          $ref: '#/components/schemas/CharacteristicKey'
          description: The characteristic to aggregate. Required for every function but `count`, which takes none.
      description: |-
        A value computed from the reports located in the region. The characteristic must be a
        number, yes/no or category characteristic that is not retired.
    WeightingBlank:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - blank
      description: |-
        A part of the function not filled in yet. Allowed only while the phenomenon is a draft,
        so that a function can be saved half-built.
    WeightingExpression:
      type: object
      oneOf:
        - $ref: '#/components/schemas/WeightingNumber'
        - $ref: '#/components/schemas/WeightingPopulation'
        - $ref: '#/components/schemas/WeightingAggregate'
        - $ref: '#/components/schemas/WeightingOperation'
        - $ref: '#/components/schemas/WeightingBlank'
      discriminator:
        propertyName: kind
        mapping:
          number: '#/components/schemas/WeightingNumber'
          population: '#/components/schemas/WeightingPopulation'
          aggregate: '#/components/schemas/WeightingAggregate'
          operation: '#/components/schemas/WeightingOperation'
          blank: '#/components/schemas/WeightingBlank'
      description: |-
        The weighting function, as a tree. It is evaluated once per region of the current
        partition, over the reports located in that region. When the result is undefined, such
        as a division by zero or a mean over no values, the region has no index, which is not
        the same as an index of 0. At most 100 nodes and 20 levels deep.
    WeightingNumber:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - number
        value:
          type: number
          format: double
      description: A constant.
    WeightingOperation:
      type: object
      required:
        - kind
        - operator
        - left
        - right
      properties:
        kind:
          type: string
          enum:
            - operation
        operator:
          $ref: '#/components/schemas/WeightingOperator'
        left:
          $ref: '#/components/schemas/WeightingExpression'
        right:
          $ref: '#/components/schemas/WeightingExpression'
      description: 'An arithmetic operation on two expressions: `left` operator `right`.'
    WeightingOperator:
      type: string
      enum:
        - add
        - subtract
        - multiply
        - divide
    WeightingPopulation:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - population
      description: The population of the region being computed.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: http://localhost:8000
    description: Local development
    variables: {}
