# The Phenomena Atlas API contract.
#
# This file is the source of truth and is written before the code that implements it.
# See ../docs/adr/0002-spec-first-contract.md
#
# Do not generate this file from the API. Do not describe endpoints in prose elsewhere.

openapi: 3.1.0

info:
  title: Phenomena Atlas API
  version: 0.0.0
  summary: The API behind Phenomena Atlas, consumed by the web and mobile clients.
  description: |
    Every Phenomena Atlas client reaches domain data through this API. No client talks
    to the database directly.

    Version 0.0.0 means the contract has not been designed yet. The first real version
    depends on the domain glossary in ../docs/domain.md being filled in.

servers:
  # TODO(team): replace with the real environments once hosting is decided.
  - url: http://localhost:8000
    description: Local development

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe.
      description: |
        Returns successfully when the service is running. Carries no domain meaning and
        is safe to call without authentication.
      security: []
      responses:
        "200":
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  # TODO(team): the domain endpoints. Blocked on docs/domain.md, which defines what a
  # phenomenon is. Design the resources here before writing any handler.

components:
  schemas:
    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      description: The error shape returned by every failing request.
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable machine-readable identifier. Clients branch on this, never on message.
          examples: [phenomenon_not_found]
        message:
          type: string
          description: Human-readable explanation. Not stable, not for client logic.
        details:
          type: object
          description: Optional structured context, shape depends on code.
          additionalProperties: true

  securitySchemes:
    # TODO(team): authentication is not decided yet. Bearer is a placeholder so that the
    # shape of a secured operation is visible; replace it with the real scheme.
    bearerAuth:
      type: http
      scheme: bearer

security:
  - bearerAuth: []
